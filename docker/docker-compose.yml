version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ww2_postgres
    environment:
      POSTGRES_USER: ww2_user
      POSTGRES_PASSWORD: ww2_password
      POSTGRES_DB: ww2_game
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ww2_network

  redis:
    image: redis:7-alpine
    container_name: ww2_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - ww2_network

volumes:
  postgres_data:
  redis_data:

networks:
  ww2_network:
    driver: bridge
